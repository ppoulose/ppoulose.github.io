
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Chaks | Neutralization Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Chaks</h1>
        <p>Chemistry Laboratory Calculator</p>
    </header>

    <main>

        <h2>HCl – NaOH Neutralization</h2>

        <p class="intro">
            Calculate the volume of sodium hydroxide
            required to neutralize a given volume
            of hydrochloric acid.
        </p>

        <div class="input-group">
            <label for="ph">Initial pH of HCl</label>
            <input type="number" id="ph"
                   min="0" max="14" step="any"
                   placeholder="e.g. 3">
        </div>

        <div class="input-group">
            <label for="volume">Volume of HCl (mL)</label>
            <input type="number" id="volume"
                   min="0" step="any"
                   placeholder="e.g. 10">
        </div>

        <div class="input-group">
            <label for="molarity">Molarity of NaOH (mol/L)</label>
            <input type="number" id="molarity"
                   min="0" step="any"
                   placeholder="e.g. 0.001">
        </div>

        <button onclick="calculate()">
            Calculate
        </button>

        <div id="result" class="result"></div>

        <footer>
            <p>
                Based on the stoichiometry of
                acid-base neutralization.
            </p>
            <p>Prepared as a chemistry learning tool.</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
